<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f5">
  <title>가족을 위한 한 달 남유럽 여행 플래너 · SlowTravel</title>
  <meta name="description" content="60대 부모님과 함께하는 여유로운 30일 남유럽 가족 여행 플래너. 스페인 남부 안달루시아, 포르투갈, 1일 1.5스팟 시에스타 루틴, 예산 및 일정 맞춤 조정.">
  <!-- PWA Manifest & CDNs (Leaflet Maps) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SlowTravel">
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22SlowTravel%22%2C%22short_name%22%3A%22SlowTravel%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23faf8f5%22%2C%22theme_color%22%3A%22%231b4332%22%7D">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNX1lvTlZBo=" crossorigin=""></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- [컴포넌트 1] 상단 글로벌 헤더 & 맞춤 환경 설정 모듈 -->
  <header class="sticky-header-container" id="mainHeader"></header>

  <!-- 가이드북 메인 레이아웃: 목차 사이드바 & 5대 챕터 본문 -->
  <main>
    <div class="guidebook-layout" id="guidebookLayout">
      <!-- [컴포넌트 2] 데스크톱 가이드북 목차 사이드바 -->
      <aside class="guidebook-sidebar" id="guidebookSidebar" aria-label="가이드북 목차">
        <div class="sidebar-header">
          <span class="sidebar-badge" data-i18n="guidebook_edition">2026 DIGITAL EDITION</span>
          <h2 class="sidebar-title" data-i18n="guidebook_toc_title">가이드북 목차</h2>
          <p class="sidebar-sub" data-i18n="guidebook_toc_sub">5대 챕터별 맞춤 탐색</p>
        </div>
        <nav class="sidebar-nav" id="sidebarChapterNav" role="tablist">
          <button type="button" class="sidebar-nav-item active" data-chapter="chapter-overview" onclick="switchGuidebookChapter('chapter-overview')" role="tab" aria-selected="true">
            <span class="chapter-num">01</span>
            <div class="chapter-info">
              <span class="chapter-name" data-i18n="chapter_name_overview">여행 개요</span>
              <span class="chapter-desc" data-i18n="chapter_desc_overview">철학 · 4대 플랜 비교</span>
            </div>
            <span class="chapter-arrow">→</span>
          </button>
          <button type="button" class="sidebar-nav-item" data-chapter="chapter-planner" onclick="switchGuidebookChapter('chapter-planner')" role="tab" aria-selected="false">
            <span class="chapter-num">02</span>
            <div class="chapter-info">
              <span class="chapter-name" data-i18n="chapter_name_planner">일정 플래너</span>
              <span class="chapter-desc" data-i18n="chapter_desc_planner">맞춤 일정 · 30일 타임라인</span>
            </div>
            <span class="chapter-arrow">→</span>
          </button>
          <button type="button" class="sidebar-nav-item" data-chapter="chapter-guide" onclick="switchGuidebookChapter('chapter-guide')" role="tab" aria-selected="false">
            <span class="chapter-num">03</span>
            <div class="chapter-info">
              <span class="chapter-name" data-i18n="chapter_name_guide">지역 가이드</span>
              <span class="chapter-desc" data-i18n="chapter_desc_guide">권역별 명소 · 이동 루트</span>
            </div>
            <span class="chapter-arrow">→</span>
          </button>
          <button type="button" class="sidebar-nav-item" data-chapter="chapter-festivals" onclick="switchGuidebookChapter('chapter-festivals')" role="tab" aria-selected="false">
            <span class="chapter-num">04</span>
            <div class="chapter-info">
              <span class="chapter-name" data-i18n="chapter_name_festivals">축제 &amp; 야경</span>
              <span class="chapter-desc" data-i18n="chapter_desc_festivals">엄선 축제 · 파노라마 뷰</span>
            </div>
            <span class="chapter-arrow">→</span>
          </button>
          <button type="button" class="sidebar-nav-item" data-chapter="chapter-practical" onclick="switchGuidebookChapter('chapter-practical')" role="tab" aria-selected="false">
            <span class="chapter-num">05</span>
            <div class="chapter-info">
              <span class="chapter-name" data-i18n="chapter_name_practical">여행 실용정보</span>
              <span class="chapter-desc" data-i18n="chapter_desc_practical">맛집 · 회화 · 교통 · 숙소</span>
            </div>
            <span class="chapter-arrow">→</span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <span class="shortcut-tip" data-i18n="shortcut_hint">⌨️ 단축키: [ / ] 또는 숫자 1~5로 장 이동</span>
        </div>
      </aside>

      <!-- [가이드북 본문] 5대 챕터 디지털 북 모듈 -->
      <div class="guidebook-content" id="guidebookMain">
        <!-- 제1장: 여행 개요 (철학 · 3대 코스 비교 · 에디토리얼 심층 가이드) -->
        <section class="guidebook-chapter active" id="chapter-overview" role="tabpanel" aria-label="제1장 여행 개요"></section>

        <!-- 제2장: 맞춤 일정 플래너 (조건 설정 · 실시간 예산 대시보드 · 30일 타임라인) -->
        <section class="guidebook-chapter" id="chapter-planner" role="tabpanel" aria-label="제2장 일정 플래너"></section>

        <!-- 제3장: 지역별 명소 가이드 (스페인 18선 · 포르투갈 18선 · 유럽 연계 37선 · 대형 지도) -->
        <section class="guidebook-chapter" id="chapter-guide" role="tabpanel" aria-label="제3장 지역 가이드"></section>

        <!-- 제4장: 축제 & 야경 (봄여름 축제 · 가을연말 축제 · 파노라마 야경 · 위시리스트) -->
        <section class="guidebook-chapter" id="chapter-festivals" role="tabpanel" aria-label="제4장 축제 및 야경"></section>

        <!-- 제5장: 여행 실용정보 (대표 미식 92선 · 필수 회화 · 교통/숙소 · 소매치기/생수 · AI 검색) -->
        <section class="guidebook-chapter" id="chapter-practical" role="tabpanel" aria-label="제5장 여행 실용정보"></section>
      </div>
    </div>
  </main>

  <!-- [컴포넌트 3] 모바일 전용 고정 하단 내비게이션 바 -->
  <nav class="mobile-bottom-nav" id="mobileBottomNav" aria-label="모바일 가이드북 목차"></nav>

  <!-- [컴포넌트 4] 하단 푸터 -->
  <footer class="footer">
    <div class="wrap" id="mainFooterText">
      <span data-i18n="footer_text">가족 여행 계획을 위한 편집 가이드 · 날짜·가격·운행·입국 규정은 바뀔 수 있으니 예약 전 공식 채널에서 최종 확인하세요.</span>
    </div>
  </footer>

  <!-- [컴포넌트 5] 공통 플로팅 도구 & 토스트 알림 컨테이너 -->
  <button id="btnBackToTop" class="back-to-top-btn" onclick="scrollToTop()" title="맨 위로 이동" aria-label="맨 위로 이동">⬆</button>
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- [컴포넌트 6] 모바일 바텀 시트 퀵 내비게이션 -->
  <nav class="bottom-mobile-nav">
    <a href="#planner" class="bottom-nav-item"><span class="b-icon">📅</span><span data-i18n="bnav_planner">플래너</span></a>
    <a href="#curated-options" class="bottom-nav-item"><span class="b-icon">🧭</span><span data-i18n="bnav_routes">3대코스</span></a>
    <a href="#dining" class="bottom-nav-item"><span class="b-icon">🍽</span><span data-i18n="bnav_dining">미식</span></a>
    <a href="#attractions" class="bottom-nav-item"><span class="b-icon">🏛</span><span data-i18n="bnav_attractions">명소</span></a>
    <a href="javascript:void(0)" onclick="toggleSettingsPanel()" class="bottom-nav-item"><span class="b-icon">⚙️</span><span data-i18n="bnav_settings">설정</span></a>
  </nav>

  <!-- [컴포넌트 7] AI 여행 챗봇 위젯 마운트 지점 -->
  <div id="chatWidgetMount"></div>

  <!-- [컴포넌트 8] 플로팅 북 리더 미니 네비게이터 -->
  <div id="floatingBookBar" class="floating-book-bar">
    <button type="button" class="btn-float-flip prev" onclick="turnBookPage(window.currentActiveChapter || 'chapter-overview', -1)" title="이전 쪽">◀ <span data-i18n="btn_prev_page">이전 쪽</span></button>
    <span class="float-book-badge" id="floatBookBadge">📖 제1장 · P. 1 / 3</span>
    <button type="button" class="btn-float-flip next" onclick="turnBookPage(window.currentActiveChapter || 'chapter-overview', 1)" title="다음 쪽"><span data-i18n="btn_next_page">다음 쪽</span> ▶</button>
  </div>

  <!-- 모듈화 스크립트 연결: 데이터 -> UI 컴포넌트 마운터 -> 앱 인터랙션 로직 -->
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
